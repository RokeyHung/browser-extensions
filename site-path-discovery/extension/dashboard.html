<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Path Discovery — Dashboard</title>
    <link rel="stylesheet" href="styles/popup.css" />
    <link rel="stylesheet" href="styles/dashboard.css" />
  </head>
  <body class="dashboard-body">
    <header class="dash-header">
      <div class="dash-header-left">
        <img class="header-logo" src="icons/icon48.png" alt="" />
        <div>
          <h1>Website Path Discovery</h1>
          <div class="dash-site" id="site-origin">—</div>
        </div>
      </div>
      <div class="dash-site-select">
        <label for="site-picker">Site</label>
        <select id="site-picker"></select>
      </div>
    </header>

    <section class="toolbar">
      <button class="btn btn-primary" id="scan">🔍 Scan page</button>
      <button class="btn btn-secondary" id="robots">robots.txt</button>
      <button class="btn btn-secondary" id="sitemap">Sitemap</button>
      <button class="btn btn-secondary" id="crawl">🕸 Start crawl</button>
      <button class="btn btn-secondary" id="export-json">Export JSON</button>
      <button class="btn btn-secondary" id="export-csv">Export CSV</button>
      <button class="btn btn-danger" id="clear">Clear data</button>
    </section>

    <section class="summary" id="summary"></section>

    <!-- Crawl panel -->
    <section class="crawl-panel" id="crawl-panel" hidden>
      <div class="crawl-config" id="crawl-config">
        <h3>Crawl configuration</h3>
        <div class="crawl-fields">
          <label>Start URL <input type="text" id="c-start" /></label>
          <label
            >Scope
            <select id="c-scope">
              <option value="same-origin">Same origin</option>
              <option value="same-site">Same site</option>
            </select>
          </label>
          <label>Max depth <input type="number" id="c-depth" min="0" max="10" /></label>
          <label>Max pages <input type="number" id="c-pages" min="1" max="1000" /></label>
          <label>Delay (ms) <input type="number" id="c-delay" min="0" max="10000" step="100" /></label>
          <label class="crawl-check"><input type="checkbox" id="c-robots" /> Respect robots.txt</label>
        </div>
        <div class="crawl-actions">
          <button class="btn btn-primary" id="crawl-start">Start</button>
          <button class="btn btn-secondary" id="crawl-cancel">Cancel</button>
        </div>
      </div>
      <div class="crawl-progress" id="crawl-progress" hidden>
        <h3>Crawling…</h3>
        <div class="crawl-stats" id="crawl-stats"></div>
        <button class="btn btn-danger" id="crawl-stop">Stop</button>
      </div>
    </section>

    <section class="tabs" id="tabs"></section>

    <section class="filter-row">
      <input type="search" id="search" placeholder="Search URL, path, method…" />
      <span class="result-count" id="result-count"></span>
    </section>

    <section class="table-wrap">
      <table class="path-table">
        <thead>
          <tr>
            <th data-sort="type">Type</th>
            <th data-sort="method">Method</th>
            <th data-sort="normalizedUrl">URL</th>
            <th data-sort="source">Source</th>
            <th data-sort="statusCode">Status</th>
            <th data-sort="firstSeenAt">First seen</th>
            <th data-sort="lastSeenAt">Last seen</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty-state" id="empty" hidden>No paths yet. Try scanning the page, reading the sitemap, or starting a crawl.</div>
    </section>

    <section class="pagination" id="pagination"></section>

    <!-- Detail drawer -->
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="drawer" hidden></aside>

    <div id="toast" class="toast" hidden></div>

    <script src="modules/exporter.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
