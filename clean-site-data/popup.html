<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clean Site Data</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 300px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        background: #1e1e2e;
        color: #cdd6f4;
        user-select: none;
      }

      /* ─── Header ─── */
      .header {
        padding: 14px 16px 12px;
        border-bottom: 1px solid #313244;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-icon {
        width: 28px;
        height: 28px;
        background: #89b4fa;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .header-icon svg {
        width: 16px;
        height: 16px;
        fill: #1e1e2e;
      }

      .header-title {
        font-size: 14px;
        font-weight: 600;
        color: #cdd6f4;
      }

      /* ─── Body ─── */
      .body {
        padding: 12px 16px;
      }

      /* ─── Site info ─── */
      .site-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6c7086;
        margin-bottom: 4px;
      }

      .site-url {
        font-size: 12px;
        color: #89b4fa;
        font-weight: 500;
        word-break: break-all;
        margin-bottom: 14px;
        padding: 6px 8px;
        background: #181825;
        border-radius: 6px;
        border: 1px solid #313244;
      }

      /* ─── Checkboxes ─── */
      .options-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6c7086;
        margin-bottom: 8px;
      }

      .options-grid {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }

      .option-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.1s;
      }

      .option-row:hover {
        background: #313244;
      }

      .option-row input[type='checkbox'] {
        width: 14px;
        height: 14px;
        accent-color: #89b4fa;
        cursor: pointer;
        flex-shrink: 0;
      }

      .option-name {
        flex: 1;
        color: #cdd6f4;
      }

      .option-badge {
        font-size: 10px;
        color: #6c7086;
        background: #313244;
        padding: 1px 5px;
        border-radius: 4px;
      }

      /* ─── Divider ─── */
      .divider {
        height: 1px;
        background: #313244;
        margin: 10px 0;
      }

      /* ─── Reload option ─── */
      .reload-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.1s;
        margin-bottom: 12px;
      }

      .reload-row:hover {
        background: #313244;
      }

      .reload-row input[type='checkbox'] {
        width: 14px;
        height: 14px;
        accent-color: #89b4fa;
        cursor: pointer;
        flex-shrink: 0;
      }

      .reload-name {
        color: #bac2de;
        font-size: 12px;
      }

      /* ─── Clean button ─── */
      .btn-clean {
        width: 100%;
        padding: 9px;
        background: #89b4fa;
        color: #1e1e2e;
        font-size: 13px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background 0.15s,
          opacity 0.15s;
      }

      .btn-clean:hover {
        background: #b4d0fb;
      }

      .btn-clean:active {
        background: #6d9fd8;
      }

      .btn-clean:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ─── Loading state ─── */
      .loading-state {
        display: none;
        text-align: center;
        padding: 16px 0 4px;
        color: #6c7086;
        font-size: 12px;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }

      .loading-state.visible {
        display: flex;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #313244;
        border-top-color: #89b4fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ─── Results ─── */
      .results {
        display: none;
        flex-direction: column;
        gap: 2px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #313244;
      }

      .results.visible {
        display: flex;
      }

      .results-title {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6c7086;
        margin-bottom: 6px;
      }

      .result-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        font-size: 12px;
      }

      .result-icon {
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 12px;
      }

      .result-icon.success {
        color: #a6e3a1;
      }

      .result-icon.error {
        color: #f38ba8;
      }

      .result-icon.skipped {
        color: #6c7086;
      }

      .result-name {
        flex: 1;
        color: #cdd6f4;
      }

      .result-msg {
        font-size: 10px;
        color: #6c7086;
        max-width: 120px;
        text-align: right;
        word-break: break-word;
      }

      .result-msg.error {
        color: #f38ba8;
      }

      .results-footer {
        margin-top: 8px;
        font-size: 11px;
        color: #6c7086;
        padding: 0 2px;
      }

      /* ─── Unsupported ─── */
      .unsupported {
        display: none;
        padding: 20px 16px;
        text-align: center;
      }

      .unsupported.visible {
        display: block;
      }

      .unsupported-icon {
        font-size: 32px;
        margin-bottom: 10px;
      }

      .unsupported-title {
        font-size: 13px;
        font-weight: 600;
        color: #cdd6f4;
        margin-bottom: 6px;
      }

      .unsupported-desc {
        font-size: 11px;
        color: #6c7086;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M19.5 4h-3V2.5A.5.5 0 0016 2H8a.5.5 0 00-.5.5V4h-3A.5.5 0 004 4.5V7a3 3 0 003 3h.16A6 6 0 0013 14.92V17h-2.5a.5.5 0 000 1h5a.5.5 0 000-1H13v-2.08A6 6 0 0016.84 10H17a3 3 0 003-3V4.5a.5.5 0 00-.5-.5zM7 9a2 2 0 01-2-2V5h2v4zm12-2a2 2 0 01-2 2V5h2v2z"
          />
        </svg>
      </div>
      <span class="header-title">Clean Site Data</span>
    </div>

    <!-- Main form (shown for valid pages) -->
    <div class="body" id="mainView">
      <div class="site-label">Current Site</div>
      <div class="site-url" id="siteUrl">Loading...</div>

      <div class="options-label">Data to Clear</div>
      <div class="options-grid">
        <label class="option-row">
          <input type="checkbox" id="opt-cookies" data-key="cookies" checked />
          <span class="option-name">Cookies</span>
          <span class="option-badge">session</span>
        </label>
        <label class="option-row">
          <input type="checkbox" id="opt-localStorage" data-key="localStorage" checked />
          <span class="option-name">Local Storage</span>
        </label>
        <label class="option-row">
          <input type="checkbox" id="opt-sessionStorage" data-key="sessionStorage" checked />
          <span class="option-name">Session Storage</span>
        </label>
        <label class="option-row">
          <input type="checkbox" id="opt-indexedDB" data-key="indexedDB" checked />
          <span class="option-name">IndexedDB</span>
        </label>
        <label class="option-row">
          <input type="checkbox" id="opt-cacheStorage" data-key="cacheStorage" checked />
          <span class="option-name">Cache Storage</span>
        </label>
        <label class="option-row">
          <input type="checkbox" id="opt-serviceWorker" data-key="serviceWorker" checked />
          <span class="option-name">Service Worker</span>
        </label>
      </div>

      <div class="divider"></div>

      <label class="reload-row">
        <input type="checkbox" id="opt-reload" checked />
        <span class="reload-name">Reload after cleaning</span>
      </label>

      <button class="btn-clean" id="btnClean">Clean Site Data</button>

      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <span>Cleaning...</span>
      </div>

      <div class="results" id="results">
        <div class="results-title">Result</div>
        <div id="resultsBody"></div>
        <div class="results-footer" id="resultsFooter"></div>
      </div>
    </div>

    <!-- Unsupported page -->
    <div class="unsupported" id="unsupportedView">
      <div class="unsupported-icon">🚫</div>
      <div class="unsupported-title">Page not supported</div>
      <div class="unsupported-desc">Please open a normal <strong>http://</strong> or <strong>https://</strong> website to use this extension.</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
