<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clean Site Data</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 300px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        background: #ffffff;
        color: #111827;
        user-select: none;
      }

      /* ─── Header ─── */
      .header {
        padding: 14px 16px 12px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-icon {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .header-icon svg {
        width: 28px;
        height: 28px;
      }

      .header-title {
        font-size: 14px;
        font-weight: 600;
        color: #111827;
      }

      /* ─── Body ─── */
      .body {
        padding: 12px 16px;
      }

      /* ─── Site info ─── */
      .site-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9ca3af;
        margin-bottom: 4px;
      }

      .site-url {
        font-size: 12px;
        color: #2563eb;
        font-weight: 500;
        word-break: break-all;
        margin-bottom: 14px;
        padding: 6px 8px;
        background: #f9fafb;
        border-radius: 6px;
        border: 1px solid #e5e7eb;
      }

      /* ─── Checkboxes ─── */
      .options-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9ca3af;
        margin-bottom: 8px;
      }

      .options-grid {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }

      .option-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.1s;
      }

      .option-row:hover {
        background: #f3f4f6;
      }

      .option-row input[type='checkbox'] {
        width: 14px;
        height: 14px;
        accent-color: #3b82f6;
        cursor: pointer;
        flex-shrink: 0;
      }

      .option-name {
        flex: 1;
        color: #111827;
      }

      .option-badge {
        font-size: 10px;
        color: #6b7280;
        background: #e5e7eb;
        padding: 1px 5px;
        border-radius: 4px;
      }

      /* ─── Divider ─── */
      .divider {
        height: 1px;
        background: #e5e7eb;
        margin: 10px 0;
      }

      /* ─── Reload option ─── */
      .reload-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.1s;
        margin-bottom: 12px;
      }

      .reload-row:hover {
        background: #f3f4f6;
      }

      .reload-row input[type='checkbox'] {
        width: 14px;
        height: 14px;
        accent-color: #3b82f6;
        cursor: pointer;
        flex-shrink: 0;
      }

      .reload-name {
        color: #374151;
        font-size: 12px;
      }

      /* ─── Clean button ─── */
      .btn-clean {
        width: 100%;
        padding: 9px;
        background: #3b82f6;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background 0.15s,
          opacity 0.15s;
      }

      .btn-clean:hover {
        background: #2563eb;
      }

      .btn-clean:active {
        background: #1d4ed8;
      }

      .btn-clean:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ─── Loading state ─── */
      .loading-state {
        display: none;
        text-align: center;
        padding: 16px 0 4px;
        color: #9ca3af;
        font-size: 12px;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }

      .loading-state.visible {
        display: flex;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #e5e7eb;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ─── Results ─── */
      .results {
        display: none;
        flex-direction: column;
        gap: 2px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #e5e7eb;
      }

      .results.visible {
        display: flex;
      }

      .results-title {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9ca3af;
        margin-bottom: 6px;
      }

      .result-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        font-size: 12px;
      }

      .result-icon {
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 12px;
      }

      .result-icon.success {
        color: #16a34a;
      }

      .result-icon.error {
        color: #dc2626;
      }

      .result-icon.skipped {
        color: #9ca3af;
      }

      .result-name {
        flex: 1;
        color: #111827;
      }

      .result-msg {
        font-size: 10px;
        color: #9ca3af;
        max-width: 120px;
        text-align: right;
        word-break: break-word;
      }

      .result-msg.error {
        color: #dc2626;
      }

      .results-footer {
        margin-top: 8px;
        font-size: 11px;
        color: #9ca3af;
        padding: 0 2px;
      }

      /* ─── Unsupported ─── */
      .unsupported {
        display: none;
        padding: 20px 16px;
        text-align: center;
      }

      .unsupported.visible {
        display: block;
      }

      .unsupported-icon {
        font-size: 32px;
        margin-bottom: 10px;
      }

      .unsupported-title {
        font-size: 13px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 6px;
      }

      .unsupported-desc {
        font-size: 11px;
        color: #9ca3af;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" fill-rule="evenodd">
            <path
              fill="#80D25B"
              d="M32,28 C36.418278,28 40,24.418278 40,20 C40,15.581722 32,2 32,2 C32,2 24,15.581722 24,20 C24,24.418278 27.581722,28 32,28 Z"
            />
            <path
              fill="#80D25B"
              d="M47.5044647,38.529591 C50.2658885,38.529591 52.5044647,36.1876959 52.5044647,33.2988218 C52.5044647,30.4099477 47.5044647,21.529591 47.5044647,21.529591 C47.5044647,21.529591 42.5044647,30.4099477 42.5044647,33.2988218 C42.5044647,36.1876959 44.743041,38.529591 47.5044647,38.529591 Z"
              transform="rotate(75 47.504 30.03)"
            />
            <rect width="58" height="12" x="3" y="48" fill="#4796E7" rx="4" />
            <path
              fill="#80D25B"
              d="M17.5044647,38.529591 C20.2658885,38.529591 22.5044647,36.1876959 22.5044647,33.2988218 C22.5044647,30.4099477 17.5044647,21.529591 17.5044647,21.529591 C17.5044647,21.529591 12.5044647,30.4099477 12.5044647,33.2988218 C12.5044647,36.1876959 14.743041,38.529591 17.5044647,38.529591 Z"
              transform="scale(-1 1) rotate(75 0 7.217)"
            />
            <path stroke="#22BA8E" stroke-linecap="square" stroke-width="2" d="M32,53 L32,16.9545689" />
            <path stroke="#22BA8E" stroke-linecap="round" stroke-width="2" d="M44,31 C37.372583,31 32,36.372583 32,43" />
            <path
              stroke="#22BA8E"
              stroke-linecap="round"
              stroke-width="2"
              d="M32,31 C25.372583,31 20,36.372583 20,43"
              transform="matrix(-1 0 0 1 52 0)"
            />
          </g>
        </svg>
      </div>
      <span class="header-title">Clean Site Data</span>
    </div>

    <!-- Main form (shown for valid pages) -->
    <div class="body" id="mainView">
      <div class="site-label">Current Site</div>
      <div class="site-url" id="siteUrl">Loading...</div>

      <div class="options-label">Data to Clear</div>
      <div class="options-grid">
        <label class="option-row">
          <input type="checkbox" id="opt-cookies" data-key="cookies" checked />
          <span class="option-name">Cookies</span>
          <span class="option-badge">session</span>
        </label>
        <label class="option-row">
          <input type="checkbox" id="opt-localStorage" data-key="localStorage" checked />
          <span class="option-name">Local Storage</span>
        </label>
        <label class="option-row">
          <input type="checkbox" id="opt-sessionStorage" data-key="sessionStorage" checked />
          <span class="option-name">Session Storage</span>
        </label>
        <label class="option-row">
          <input type="checkbox" id="opt-indexedDB" data-key="indexedDB" checked />
          <span class="option-name">IndexedDB</span>
        </label>
        <label class="option-row">
          <input type="checkbox" id="opt-cacheStorage" data-key="cacheStorage" checked />
          <span class="option-name">Cache Storage</span>
        </label>
        <label class="option-row">
          <input type="checkbox" id="opt-serviceWorker" data-key="serviceWorker" checked />
          <span class="option-name">Service Worker</span>
        </label>
      </div>

      <div class="divider"></div>

      <label class="reload-row">
        <input type="checkbox" id="opt-reload" checked />
        <span class="reload-name">Go to homepage after cleaning</span>
      </label>

      <button class="btn-clean" id="btnClean">Clean Site Data</button>

      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <span>Cleaning...</span>
      </div>

      <div class="results" id="results">
        <div class="results-title">Result</div>
        <div id="resultsBody"></div>
        <div class="results-footer" id="resultsFooter"></div>
      </div>
    </div>

    <!-- Unsupported page -->
    <div class="unsupported" id="unsupportedView">
      <div class="unsupported-icon">🚫</div>
      <div class="unsupported-title">Page not supported</div>
      <div class="unsupported-desc">Please open a normal <strong>http://</strong> or <strong>https://</strong> website to use this extension.</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
